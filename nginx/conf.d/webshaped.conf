map $http_x_forwarded_proto $redirect_scheme {
    default $scheme;
    https   https;
}

map $host $canonical_host {
    default         "";
    www.webshaped.de webshaped.de;
}

map $request_uri $legacy_post_slug {
    default "";

    # Pre-rename WordPress slug for this post, still indexed by Google —
    # confirmed 404ing before this entry was added (2026-08-16 SEO audit).
    ~^/pagespeed-optimierung(/|$)                                                     automatische-matomo-backups;
    ~^/automatische-matomo-backups(/|$)                                              automatische-matomo-backups;
    ~^/matomo-tracking-script-optimal-einbinden(/|$)                                 matomo-tracking-script-optimal-einbinden;
    ~^/gutenberg-standard-vollbildmodus-deaktivieren-wordpress-5-4(/|$)              gutenberg-standard-vollbildmodus-deaktivieren-wordpress-5-4;
    ~^/wordpress-comment-form-validation-interaktiv-mit-javascript(/|$)              wordpress-comment-form-validation-interaktiv-mit-javascript;
    ~^/code-dokumentieren-leicht-gemacht-vs-code-extension-guide(/|$)                code-dokumentieren-leicht-gemacht-vs-code-extension-guide;
    ~^/datenschutz-checkbox-fuer-wordpress-kommentare-ohne-plugin(/|$)               datenschutz-checkbox-fuer-wordpress-kommentare-ohne-plugin;
    ~^/stockfoto-sammlung(/|$)                                                       stockfoto-sammlung;
}

server {
    listen 80 default_server;
    # develop.webshaped.de is already covered by default_server + the `_`
    # catch-all below; listed explicitly anyway so this block keeps matching
    # it by name if a second vhost is ever added to this image.
    server_name webshaped.de www.webshaped.de develop.webshaped.de _;
    absolute_redirect off;

    if ($canonical_host != "") {
        return 301 $redirect_scheme://$canonical_host$request_uri;
    }

    if ($legacy_post_slug != "") {
        return 301 /de/posts/$legacy_post_slug$is_args$args;
    }

    # Astro's hashed build output (/_astro/*.js, *.css, fonts) is safe to
    # cache forever — a content change ships under a new filename. Matched
    # before the general location so it wins over the app's own max-age=0.
    location /_astro/ {
        proxy_pass http://app:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # A location block with its own add_header stops inheriting the
        # parent context's add_header directives entirely (nginx quirk) —
        # so the security headers below are repeated here rather than only
        # living in the general location.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    location / {
        proxy_pass http://app:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # CSP is deliberately not set here yet: the app renders inline
        # scripts (loading indicator, per-page JSON-LD in BlogPost.astro /
        # DefaultLayout.astro) whose content varies per request, so a safe
        # policy needs per-request nonces threaded through those templates,
        # not a blanket 'unsafe-inline' or a static hash allowlist. Tracked
        # as its own follow-up rather than shipped half-right here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
