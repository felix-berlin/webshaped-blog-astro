query GhRepos($after: String) {
  viewer {
    repositories(first: 100, after: $after, ownerAffiliations: OWNER) {
      nodes {
        ...GhRepoFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

fragment GhRepoFields on Repository {
  name
  stargazerCount
  url
  description
  languages(first: 10, orderBy: { field: SIZE, direction: DESC }) {
    edges {
      size
      node {
        name
      }
    }
  }
}
