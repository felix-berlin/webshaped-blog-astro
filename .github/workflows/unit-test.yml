name: Unit tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  VITEST_CI: true

jobs:
  lint:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          identity-id: "8938f75a-fe73-4688-a8ed-e12dc90e6c0f"
          project-slug: "web-shaped"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies 🛠️
        run: pnpm i --frozen-lockfile

      - name: Run Vitest (with coverage and JUnit report) 🧪
        run: pnpm run test:unit:ci
        env:
          SITE_URL: "http://localhost:4321"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./tests/unit/coverage
        env:
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ./test-report.junit.xml
        env:
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
