name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  # - "**"
  # pull_request:
  # The trigger on release and prerelease does not work, so i use push tags instead
  # release:
  #   types: [published] # Ensure the workflow runs only when a release is published

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: "8938f75a-fe73-4688-a8ed-e12dc90e6c0f"
          project-slug: "web-shaped"
          env-slug: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}
          domain: "https://infisical.kasimir.dev"

      - name: Docker meta (app)
        id: meta_app
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Verify app Dockerfile exists
        run: |
          if [[ ! -f "Dockerfile" ]]; then
            echo "ERROR: Dockerfile not found! This would result in the wrong Dockerfile being used." >&2
            exit 1
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build env secret
        id: build_env
        # Values come from Infisical via $GITHUB_ENV; restate them so the script
        # sees them and so the required-var list stays visible here.
        env:
          WP_API: ${{ env.WP_API }}
          WP_REST_API: ${{ env.WP_REST_API }}
          WP_AUTH_USER: ${{ env.WP_AUTH_USER }}
          WP_AUTH_PASS: ${{ env.WP_AUTH_PASS }}
          LAST_FM_SCROBBLER_API: ${{ env.LAST_FM_SCROBBLER_API }}
          ENABLE_ANALYTICS: ${{ env.ENABLE_ANALYTICS }}
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
          SENTRY_PROJECT_ID: ${{ env.SENTRY_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ env.SENTRY_ENVIRONMENT }}
          SITE_URL: ${{ env.SITE_URL }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
        run: |
          set -e

          ./scripts/write-build-env.sh .build.env

          # BuildKit's cache key for a --mount=type=secret RUN step ignores the
          # secret's content by design (so secret rotation alone doesn't bust
          # unrelated caches). Without this, a secret-only rotation (e.g.
          # WP_AUTH_PASS) would silently reuse a cached layer built with the
          # old value. Hash the actual secret content and feed it through
          # BUILD_ENV_HASH so the cache only invalidates when secrets change.
          echo "hash=$(sha256sum .build.env | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          build-args: |
            BUILD_ENV_HASH=${{ steps.build_env.outputs.hash }}
          secret-files: |
            build_env=.build.env
          cache-from: |
            type=gha,scope=app
          cache-to: |
            type=gha,mode=max,scope=app

      - name: Cleanup build env secret
        if: always()
        run: rm -f .build.env

  build-proxy:
    needs: build-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker meta (proxy)
        id: meta_proxy
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-proxy
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Verify proxy Dockerfile exists
        run: |
          if [[ ! -f "docker/nginx.Dockerfile" ]]; then
            echo "ERROR: docker/nginx.Dockerfile not found! This would result in the wrong Dockerfile being used." >&2
            exit 1
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push proxy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nginx.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_proxy.outputs.tags }}
          labels: ${{ steps.meta_proxy.outputs.labels }}
          cache-from: |
            type=gha,scope=proxy
          cache-to: |
            type=gha,mode=max,scope=proxy
