name: Playwright Tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          identity-id: "8938f75a-fe73-4688-a8ed-e12dc90e6c0f"
          project-slug: "web-shaped"
          env-slug: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      # Traces/screenshots/console logs can contain secrets — this repo is public,
      # so GitHub Actions artifacts are downloadable by anyone. Encrypt before
      # upload per https://playwright.dev/docs/ci-intro#properly-handling-secrets.
      # Decrypt locally with:
      #   gpg --decrypt --batch --passphrase "$PLAYWRIGHT_REPORT_PASSPHRASE" \
      #     playwright-report.tar.gz.gpg | tar xz
      - name: Encrypt HTML report
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_REPORT_PASSPHRASE: ${{ secrets.PLAYWRIGHT_REPORT_PASSPHRASE }}
        run: |
          tar czf playwright-report.tar.gz playwright-report/
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PLAYWRIGHT_REPORT_PASSPHRASE" \
            -o playwright-report.tar.gz.gpg playwright-report.tar.gz
          rm playwright-report.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report.tar.gz.gpg
          retention-days: 14
