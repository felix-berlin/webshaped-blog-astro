name: Docker Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
      - beta
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "nginx/**"
      - "scripts/docker-smoke-test.sh"
      - "scripts/write-build-env.sh"
      - ".github/workflows/docker-smoke-test.yml"
  workflow_dispatch:

# id-token: write is required for Infisical's OIDC auth.
permissions:
  contents: read
  id-token: write

jobs:
  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      # varlock resolves the secrets itself via OIDC (see .env.schema), so there is
      # no separate fetch step and no credentials in this workflow.
      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Setup environment 🔧
        env:
          APP_ENV: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}
        run: |
          set -e

          # .build.env is sourced by the Dockerfile (needs %q); .env is read by
          # Compose's env_file, which parses values literally (needs raw).
          pnpm exec varlock run -- ./scripts/write-build-env.sh .build.env quoted
          pnpm exec varlock run -- ./scripts/write-build-env.sh .env raw

          echo "BUILD_ENV_FILE=.build.env" >> $GITHUB_ENV
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Make smoke test script executable 🔨
        run: chmod +x ./scripts/docker-smoke-test.sh

      - name: Run Docker Smoke Test 🐳
        run: ./scripts/docker-smoke-test.sh

      - name: Upload Docker logs on failure 📋
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-test-logs
          path: docker-smoke-test-compose.log
          retention-days: 7
          if-no-files-found: ignore
