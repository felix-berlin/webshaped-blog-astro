name: Docker Smoke Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "nginx/**"
      - "scripts/docker-smoke-test.sh"
      - "scripts/write-build-env.sh"
      - ".github/workflows/docker-smoke-test.yml"
      - "package.json"
      - "pnpm-lock.yaml"

# id-token: write is required for Infisical's OIDC auth.
permissions:
  contents: read
  id-token: write

jobs:
  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: "oidc"
          identity-id: "8938f75a-fe73-4688-a8ed-e12dc90e6c0f"
          project-slug: "web-shaped"
          env-slug: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup environment 🔧
        env:
          WP_API: ${{ env.WP_API }}
          WP_REST_API: ${{ env.WP_REST_API }}
          WP_AUTH_USER: ${{ env.WP_AUTH_USER }}
          WP_AUTH_PASS: ${{ env.WP_AUTH_PASS }}
          LAST_FM_SCROBBLER_API: ${{ env.LAST_FM_SCROBBLER_API }}
          ENABLE_ANALYTICS: ${{ env.ENABLE_ANALYTICS }}
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
          SENTRY_PROJECT_ID: ${{ env.SENTRY_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ env.SENTRY_ENVIRONMENT }}
          SITE_URL: ${{ env.SITE_URL }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
        run: |
          set -e

          # .build.env is sourced by the Dockerfile (needs %q); .env is read by
          # Compose's own variable-substitution loader, which parses values
          # literally (needs raw).
          ./scripts/write-build-env.sh .build.env quoted
          ./scripts/write-build-env.sh .env raw

          echo "BUILD_ENV_FILE=.build.env" >> $GITHUB_ENV
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          # Enables Compose's native Buildx Bake integration, which honors the
          # x-bake cache-from/cache-to hints on each service in compose.yaml.
          echo "COMPOSE_BAKE=true" >> $GITHUB_ENV

      - name: Make smoke test script executable 🔨
        run: chmod +x ./scripts/docker-smoke-test.sh

      - name: Run Docker Smoke Test 🐳
        run: ./scripts/docker-smoke-test.sh

      - name: Upload Docker logs on failure 📋
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-test-logs
          path: docker-smoke-test-compose.log
          retention-days: 7
          if-no-files-found: ignore
