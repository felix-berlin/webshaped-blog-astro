services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - build_env
      x-bake:
        cache-from: [type=gha, scope=app]
        cache-to: [type=gha, mode=max, scope=app]
    container_name: webshaped-blog-astro
    ports:
      - "${HOST_PORT:-4321}:4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      WP_API: ${WP_API:?}
      WP_REST_API: ${WP_REST_API:?}
      WP_AUTH_USER: ${WP_AUTH_USER:?}
      WP_AUTH_PASS: ${WP_AUTH_PASS:?}
      LAST_FM_SCROBBLER_API: ${LAST_FM_SCROBBLER_API:?}
      SITE_URL: ${SITE_URL:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      IMAGOR_HOST: ${IMAGOR_HOST:?}
      IMAGOR_SECRET: ${IMAGOR_SECRET:?}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_PROJECT_ID: ${SENTRY_PROJECT_ID:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  build_env:
    file: ${BUILD_ENV_FILE:-.build.env}
