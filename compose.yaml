services:
  proxy:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      x-bake:
        cache-from: [type=gha, scope=proxy]
        cache-to: [type=gha, mode=max, scope=proxy]
    container_name: webshaped-blog-astro-proxy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"
    # Optional: Uncomment volumes below to override nginx configs locally during development
    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./nginx/conf.d/webshaped.conf:/etc/nginx/conf.d/webshaped.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - build_env
      x-bake:
        cache-from: [type=gha, scope=app]
        cache-to: [type=gha, mode=max, scope=app]
    container_name: webshaped-blog-astro
    expose:
      - "4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      WP_API: ${WP_API:?}
      WP_REST_API: ${WP_REST_API:?}
      WP_AUTH_USER: ${WP_AUTH_USER:?}
      WP_AUTH_PASS: ${WP_AUTH_PASS:?}
      LAST_FM_SCROBBLER_API: ${LAST_FM_SCROBBLER_API:?}
      SITE_URL: ${SITE_URL:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_PROJECT_ID: ${SENTRY_PROJECT_ID:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  build_env:
    file: ${BUILD_ENV_FILE:-.build.env}
