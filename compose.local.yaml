# Local-testing override only — do NOT use for the documented deployment flow
# (see CLAUDE.md, "Local/self-hosted deployment"). Publishes the app container's
# port directly to the host so you can hit it without going through nginx.
#
# Usage:
#   infisical run --env=dev -- docker compose -f compose.yaml -f compose.local.yaml up --build
#
# Then: http://localhost:4321/...

services:
  app:
    ports:
      - "4321:4321"
